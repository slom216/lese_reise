<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#e6ddcc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="DeuLern Lese Reise — graded German reading texts for A1, A2 and B1 with glossary and comprehension questions."
    />
    <title>DeuLern Lese Reise</title>
    <script>
      // Applies the saved theme before first paint. Key must match STORAGE_KEY in src/store/progress.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('lese-reise') || '{}').state.settings
          .theme;
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
